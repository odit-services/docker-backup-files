name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$tag" -v version="$version" '
              /^### / { line=$0; gsub(/\[|\]\([^)]*\)/, "", line); if (index(line, tag) || index(line, "v" version) || index(line, version)) { capture=1; next } }
              capture && /^### / { exit }
              capture { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              cp CHANGELOG.md release-notes.md
            fi
          else
            git log --oneline "${tag}" -n 20 > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag --draft)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${ARGS[@]}"
